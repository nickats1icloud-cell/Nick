<!doctype html>
<html lang="el" class="theme-dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Οδηγός του Μήνα · Greek SimRacers</title>
    <meta name="description" content="Πρότεινε και ψήφισε τον οδηγό του μήνα." />
    <meta name="theme-color" content="#0f1113" />
    <meta property="og:title" content="Οδηγός του Μήνα · Greek SimRacers" />
    <meta property="og:description" content="Πρότεινε και ψήφισε τον οδηγό του μήνα." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="assets/logo.png" />
    <link rel="icon" href="assets/logo.png" />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/shell.css" />
    <link rel="stylesheet" href="css/pages.css" />
    <script>
      // Εφαρμογή θέματος πριν το πρώτο paint — αποφεύγει το «άσπρο φλας».
      (function () {
        var saved = localStorage.getItem("hub-theme");
        var light = saved ? saved === "light" : matchMedia("(prefers-color-scheme: light)").matches;
        document.documentElement.classList.add(light ? "theme-light" : "theme-dark");
        document.documentElement.style.colorScheme = light ? "light" : "dark";
      })();
    </script>
  </head>
  <body>
    <div class="hub-page">
      <main class="hub-page__main">
        <header class="hub-head">
          <div class="u-shell hub-head__inner">
            <span class="hub-eyebrow">Κοινότητα</span>
            <h1>Οδηγός του <span class="u-heat-text">Μήνα</span></h1>
            <p>Πρότεινε έναν οδηγό και ψήφισε. Μία ψήφος ανά μέλος, κάθε μήνα.</p>
            <div class="u-row u-row--wrap" style="margin-top: 20px">
              <span class="hub-badge hub-badge--ember" id="dotm-month">—</span>
              <button class="hub-btn hub-btn--primary" id="dotm-nominate" type="button">+ Πρόταση οδηγού</button>
            </div>
          </div>
        </header>

        <section class="u-shell" style="padding-block: 30px 60px">
          <div class="u-grid u-grid--3" id="dotm-list"></div>
        </section>

      </main>
      <div data-shell-footer></div>
    </div>

    <!-- Το UMD bundle του Supabase φορτώνεται πριν τα modules (χωρίς npm/build). -->
    <script src="js/vendor/supabase.umd.js"></script>
    <script type="module" src="js/pages/dotm.js"></script>
  </body>
</html>

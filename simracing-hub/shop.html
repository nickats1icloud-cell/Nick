<!doctype html>
<html lang="el" class="theme-dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shop · Greek SimRacers</title>
    <meta name="description" content="Επίσημα προϊόντα της κοινότητας Greek SimRacers." />
    <meta name="theme-color" content="#0f1113" />
    <meta property="og:title" content="Shop · Greek SimRacers" />
    <meta property="og:description" content="Επίσημα προϊόντα της κοινότητας Greek SimRacers." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="assets/logo.png" />
    <link rel="icon" href="assets/logo.png" />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/shell.css" />
    <link rel="stylesheet" href="css/pages.css" />
    <script>
      // Εφαρμογή θέματος πριν το πρώτο paint — αποφεύγει το «άσπρο φλας».
      (function () {
        var saved = localStorage.getItem("hub-theme");
        var light = saved ? saved === "light" : matchMedia("(prefers-color-scheme: light)").matches;
        document.documentElement.classList.add(light ? "theme-light" : "theme-dark");
        document.documentElement.style.colorScheme = light ? "light" : "dark";
      })();
    </script>
  </head>
  <body>
    <div class="hub-page">
      <main class="hub-page__main">
        <header class="hub-head">
          <div class="u-shell hub-head__inner">
            <span class="hub-eyebrow">Store</span>
            <h1><span class="u-heat-text">Shop</span></h1>
            <p>Επίσημα προϊόντα της κοινότητας. Η παραγγελία καταχωρείται και επικοινωνούμε μαζί σου.</p>
            <div class="u-row u-row--wrap" style="margin-top: 20px">
              <div class="hub-chips" id="shop-cats"></div>
              <span class="u-spacer"></span>
              <button class="hub-btn hub-btn--primary" id="shop-cart" type="button">🛒 Καλάθι (<span id="shop-count">0</span>)</button>
              <button class="hub-btn hub-btn--ghost" id="shop-orders" type="button" hidden>Οι παραγγελίες μου</button>
            </div>
          </div>
        </header>

        <section class="u-shell" style="padding-block: 30px 60px">
          <div class="u-grid u-grid--3" id="shop-list"></div>
        </section>

      </main>
      <div data-shell-footer></div>
    </div>

    <!-- Το UMD bundle του Supabase φορτώνεται πριν τα modules (χωρίς npm/build). -->
    <script src="js/vendor/supabase.umd.js"></script>
    <script type="module" src="js/pages/shop.js"></script>
  </body>
</html>

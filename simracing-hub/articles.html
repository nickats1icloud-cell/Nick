<!doctype html>
<html lang="el" class="theme-dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Άρθρα · Greek SimRacers</title>
    <meta name="description" content="Νέα, αναλύσεις, reviews και guides από την ελληνική κοινότητα sim racing." />
    <meta name="theme-color" content="#0f1113" />
    <meta property="og:title" content="Άρθρα · Greek SimRacers" />
    <meta property="og:description" content="Νέα, αναλύσεις, reviews και guides από την ελληνική κοινότητα sim racing." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="assets/logo.png" />
    <link rel="icon" href="assets/logo.png" />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/shell.css" />
    <link rel="stylesheet" href="css/pages.css" />
    <script>
      // Εφαρμογή θέματος πριν το πρώτο paint — αποφεύγει το «άσπρο φλας».
      (function () {
        var saved = localStorage.getItem("hub-theme");
        var light = saved ? saved === "light" : matchMedia("(prefers-color-scheme: light)").matches;
        document.documentElement.classList.add(light ? "theme-light" : "theme-dark");
        document.documentElement.style.colorScheme = light ? "light" : "dark";
      })();
    </script>
  </head>
  <body>
    <div class="hub-page">
      <main class="hub-page__main">
        <header class="hub-head">
          <div class="u-shell hub-head__inner">
            <span class="hub-eyebrow">Κοινότητα</span>
            <h1>Άρθρα &amp; <span class="u-heat-text">Νέα</span></h1>
            <p>Αναλύσεις, guides και νέα από τα μέλη της κοινότητας.</p>
            <div class="u-row u-row--wrap" style="margin-top: 20px">
              <input class="hub-input" id="art-search" type="search" placeholder="Αναζήτηση άρθρου…" style="max-width: 320px" />
              <button class="hub-btn hub-btn--primary" id="art-new" type="button" hidden>+ Νέο άρθρο</button>
            </div>
            <div class="hub-chips" id="art-cats" style="margin-top: 14px"></div>
          </div>
        </header>

        <section class="u-shell" style="padding-block: 30px 60px">
          <div class="u-grid u-grid--3" id="art-list"></div>
        </section>

      </main>
      <div data-shell-footer></div>
    </div>

    <!-- Το UMD bundle του Supabase φορτώνεται πριν τα modules (χωρίς npm/build). -->
    <script src="js/vendor/supabase.umd.js"></script>
    <script type="module" src="js/pages/articles.js"></script>
  </body>
</html>

<!doctype html>
<html lang="el" class="theme-dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Predictions · Greek SimRacers</title>
    <meta name="description" content="Πρόβλεψε τα αποτελέσματα των αγώνων και μάζεψε πόντους." />
    <meta name="theme-color" content="#0f1113" />
    <meta property="og:title" content="Predictions · Greek SimRacers" />
    <meta property="og:description" content="Πρόβλεψε τα αποτελέσματα των αγώνων και μάζεψε πόντους." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="assets/logo.png" />
    <link rel="icon" href="assets/logo.png" />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/shell.css" />
    <link rel="stylesheet" href="css/pages.css" />
    <script>
      // Εφαρμογή θέματος πριν το πρώτο paint — αποφεύγει το «άσπρο φλας».
      (function () {
        var saved = localStorage.getItem("hub-theme");
        var light = saved ? saved === "light" : matchMedia("(prefers-color-scheme: light)").matches;
        document.documentElement.classList.add(light ? "theme-light" : "theme-dark");
        document.documentElement.style.colorScheme = light ? "light" : "dark";
      })();
    </script>
  </head>
  <body>
    <div class="hub-page">
      <main class="hub-page__main">
        <header class="hub-head">
          <div class="u-shell hub-head__inner">
            <span class="hub-eyebrow">Racing</span>
            <h1><span class="u-heat-text">Predictions</span></h1>
            <p>Πρόβλεψε ποιος θα ανέβει στο βάθρο πριν κλείσει η προθεσμία.</p>

          </div>
        </header>

        <section class="u-shell" style="padding-block: 30px 60px">
          <div class="hub-tabs" style="max-width: 420px; margin-bottom: 22px">
            <button class="hub-tabs__btn is-active" data-tab="events" type="button">Αγώνες</button>
            <button class="hub-tabs__btn" data-tab="board" type="button">Βαθμολογία</button>
          </div>
          <div id="pred-events" class="u-stack" style="--gap: 14px"></div>
          <div id="pred-board" hidden></div>
        </section>

      </main>
      <div data-shell-footer></div>
    </div>

    <!-- Το UMD bundle του Supabase φορτώνεται πριν τα modules (χωρίς npm/build). -->
    <script src="js/vendor/supabase.umd.js"></script>
    <script type="module" src="js/pages/predictions.js"></script>
  </body>
</html>

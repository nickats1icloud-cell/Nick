<!doctype html>
<html lang="el" class="theme-dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Σύνδεση · Greek SimRacers</title>
    <meta name="description" content="Σύνδεση ή εγγραφή στην κοινότητα Greek SimRacers." />
    <meta name="theme-color" content="#0f1113" />
    <meta property="og:title" content="Σύνδεση · Greek SimRacers" />
    <meta property="og:description" content="Σύνδεση ή εγγραφή στην κοινότητα Greek SimRacers." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="assets/logo.png" />
    <link rel="icon" href="assets/logo.png" />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/shell.css" />
    <link rel="stylesheet" href="css/pages.css" />
    <script>
      // Εφαρμογή θέματος πριν το πρώτο paint — αποφεύγει το «άσπρο φλας».
      (function () {
        var saved = localStorage.getItem("hub-theme");
        var light = saved ? saved === "light" : matchMedia("(prefers-color-scheme: light)").matches;
        document.documentElement.classList.add(light ? "theme-light" : "theme-dark");
        document.documentElement.style.colorScheme = light ? "light" : "dark";
      })();
    </script>
  </head>
  <body>
    <div class="hub-page">
      <main class="hub-page__main">
        <div class="auth">
          <div class="auth__form-side">
            <canvas class="hub-canvas" id="auth-canvas" aria-hidden="true"></canvas>

            <div class="auth__box">
              <a class="hub-nav__brand" href="home.html" style="margin-bottom: 28px">
                <img class="hub-nav__logo" src="assets/logo.png" alt="" />
                <span class="hub-nav__word">Greek<em>SimRacers</em></span>
              </a>

              <h1 id="auth-title" style="font-size: 1.9rem">Σύνδεση</h1>
              <p class="u-dim u-small" id="auth-lead" style="margin: 6px 0 26px">Καλώς ήρθες πίσω στην πίστα</p>

              <div class="auth__steps" id="auth-steps" hidden><i class="on"></i><i></i></div>

              <form id="auth-form" class="u-stack" style="--gap: 14px" novalidate></form>

              <p class="u-small u-dim u-center" style="margin-top: 26px" id="auth-switch"></p>
            </div>
          </div>

          <aside class="auth__art">
            <canvas class="hub-canvas" id="auth-art-canvas" aria-hidden="true"></canvas>
            <div class="auth__art-inner">
              <img src="assets/logo.png" alt="" style="width: 104px; margin: 0 auto 24px; filter: drop-shadow(0 0 30px hsl(var(--ember) / 0.5))" />
              <h2>Ζήσε την<br /><span class="u-heat-text">Αδρεναλίνη</span></h2>
              <p class="u-dim" style="max-width: 34ch; margin: 16px auto 0">
                Η μεγαλύτερη ελληνική κοινότητα sim racing σε περιμένει.
              </p>
              <div class="u-row" style="justify-content: center; gap: 34px; margin-top: 34px">
                <div><p class="u-heat-text" style="font-family: var(--font-display); font-size: 1.8rem; font-weight: 700">1000+</p><p class="u-tiny u-faint">Μέλη</p></div>
                <div><p class="u-chill-text" style="font-family: var(--font-display); font-size: 1.8rem; font-weight: 700" id="auth-threads">—</p><p class="u-tiny u-faint">Συζητήσεις</p></div>
              </div>
            </div>
          </aside>
        </div>

      </main>
      <div data-shell-footer></div>
    </div>

    <!-- Το UMD bundle του Supabase φορτώνεται πριν τα modules (χωρίς npm/build). -->
    <script src="js/vendor/supabase.umd.js"></script>
    <script type="module" src="js/pages/auth.js"></script>
  </body>
</html>

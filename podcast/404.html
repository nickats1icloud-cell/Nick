    <script>
      try {
        const stored = JSON.parse(localStorage.getItem("gsrp:theme"));
        const light = stored
          ? stored === "light"
          : matchMedia("(prefers-color-scheme: light)").matches;
        if (light) document.documentElement.classList.add("light");
      } catch (e) {}
    </script>

    <main id="main" class="container err">
      <div>
        <div class="err__code">404</div>
        <h1 style="margin-block: 1rem">Λάθος στροφή</h1>
        <p class="lead" style="margin-inline: auto">
          Η σελίδα που έψαχνες βγήκε εκτός πίστας. Δοκίμασε από την αρχή ή ψάξε
          κατευθείαν στα επεισόδια.
        </p>
        <div class="row" style="justify-content: center; margin-top: 2rem">
          <a class="btn btn--primary" href="index.html">Αρχική</a>
          <a class="btn" href="episodes.html">Επεισόδια</a>
          <button class="btn btn--ghost" data-open-palette>Αναζήτηση</button>

<!doctype html>
<html lang="el">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Επεισόδιο — Greek SimRacers Podcast</title>
    <meta name="description" content="Επεισόδιο του Greek SimRacers Podcast με chapters, σημειώσεις και απομαγνητοφώνηση." />
    <meta name="theme-color" content="#07070e" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23f97316'/><rect x='38' y='18' width='24' height='42' rx='12' fill='%23170a02'/><path d='M28 50a22 22 0 0 0 44 0' stroke='%23170a02' stroke-width='8' fill='none' stroke-linecap='round'/><path d='M50 72v12' stroke='%23170a02' stroke-width='8' stroke-linecap='round'/></svg>" />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/pages.css" />
    <script>
      try {
        const stored = JSON.parse(localStorage.getItem("gsrp:theme"));
        const light = stored
          ? stored === "light"
          : matchMedia("(prefers-color-scheme: light)").matches;
        if (light) document.documentElement.classList.add("light");
      } catch (e) {}
    </script>
  </head>
  <body>
    <a class="skip-link" href="#main">Μετάβαση στο περιεχόμενο</a>

    <main id="main">
      <section class="ep-hero">
        <div class="container">
          <a class="btn btn--sm btn--ghost" href="episodes.html" style="margin-bottom: 1.5rem">
            ← Όλα τα επεισόδια
          </a>
          <div class="ep-hero__inner" data-hero></div>
        </div>
      </section>

      <div class="container ep-layout">
        <div>
          <div class="tabs" role="tablist" aria-label="Περιεχόμενο επεισοδίου">
            <button class="tab" role="tab" id="tab-notes" aria-controls="panel-notes" aria-selected="true">
              Σημειώσεις
            </button>
            <button class="tab" role="tab" id="tab-chapters" aria-controls="panel-chapters" aria-selected="false">
              Ενότητες
            </button>
            <button class="tab" role="tab" id="tab-transcript" aria-controls="panel-transcript" aria-selected="false">
              Απομαγνητοφώνηση
            </button>
          </div>

          <div class="tabpanel prose" id="panel-notes" role="tabpanel" aria-labelledby="tab-notes" data-notes></div>
          <div class="tabpanel" id="panel-chapters" role="tabpanel" aria-labelledby="tab-chapters" hidden data-chapters></div>
          <div class="tabpanel" id="panel-transcript" role="tabpanel" aria-labelledby="tab-transcript" hidden data-transcript></div>
        </div>

        <aside class="ep-side" data-side></aside>
      </div>

      <section class="section section--tight">
        <div class="container">
          <div class="section-head">
            <div>
              <span class="eyebrow">Συνέχισε</span>
              <h2>Σχετικά επεισόδια</h2>
            </div>
          </div>
          <div class="ep-list" data-related></div>
        </div>
      </section>
    </main>

    <script type="module" src="js/episode-page.js"></script>
  </body>
</html>

<!doctype html>
<html lang="el">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="assets/logo.png" />
    <title>Νέος Κωδικός - Greek Simracers</title>
    <meta name="description" content="Όρισε νέο κωδικό για τον λογαριασμό σου." />

    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />

    <!-- Supabase JS (vendored, χωρίς CDN) — ορίζει το window.supabase -->
    <script src="js/vendor/supabase.umd.js" defer></script>
    <style>
      .reset {
        min-height: calc(100vh - 4.25rem);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 3rem 1.5rem;
      }
      .reset__box {
        width: 100%;
        max-width: 24rem;
      }
    </style>
  </head>
  <body data-page="auth">
    <div id="site-header"></div>

    <main class="reset">
      <div class="reset__box gsr__card">
        <h2>Νέος Κωδικός</h2>
        <p style="color: hsl(var(--muted-foreground)); font-size: 0.9rem">
          Όρισε τον νέο κωδικό για τον λογαριασμό σου.
        </p>
        <form id="form-reset">
          <div class="gsr__field">
            <label class="gsr__label" for="new-password">Νέος κωδικός (τουλάχιστον 6 χαρακτήρες)</label>
            <input class="gsr__input" type="password" id="new-password" required minlength="6" autocomplete="new-password" />
          </div>
          <div class="gsr__field">
            <label class="gsr__label" for="confirm-password">Επιβεβαίωση κωδικού</label>
            <input class="gsr__input" type="password" id="confirm-password" required minlength="6" autocomplete="new-password" />
          </div>
          <button type="submit" class="gsr__btn gsr__btn--primary gsr__btn--block">Αποθήκευση</button>
        </form>
      </div>
    </main>

    <div id="site-footer"></div>

    <script type="module">
      import { mountShell } from "./js/partials.js";
      import { supabase } from "./js/supabase-client.js";
      import { toast } from "./js/toast.js";

      // Το recovery session δημιουργείται αυτόματα από το link του email —
      // το mountShell/initAuth θα το παραλάβει.
      mountShell(document.body.dataset.page);

      document.getElementById("form-reset").addEventListener("submit", async (e) => {
        e.preventDefault();
        const password = document.getElementById("new-password").value;
        const confirm = document.getElementById("confirm-password").value;
        if (password !== confirm) {
          toast.error("Οι κωδικοί δεν ταιριάζουν.");
          return;
        }
        const btn = e.target.querySelector("button[type=submit]");
        btn.disabled = true;
        const { error } = await supabase.auth.updateUser({ password });
        btn.disabled = false;
        if (error) {
          toast.error("Δεν ήταν δυνατή η αλλαγή κωδικού — δοκίμασε ξανά από το email επαναφοράς.");
          return;
        }
        toast.success("Ο κωδικός άλλαξε! Μπορείς να συνδεθείς.");
        setTimeout(() => (window.location.href = "auth.html"), 1200);
      });
    </script>
  </body>
</html>

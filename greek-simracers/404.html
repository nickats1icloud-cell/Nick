<!doctype html>
<html lang="el">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="assets/logo.png" />
    <title>404 - Greek Simracers</title>
    <meta name="description" content="Η σελίδα δεν βρέθηκε — λάθος στροφή! Επίστρεψε στην αρχική των Greek Simracers." />

    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />

    <!-- Supabase JS (vendored, χωρίς CDN) — ορίζει το window.supabase -->
    <script src="js/vendor/supabase.umd.js" defer></script>

    <!-- Τα tokens.css/base.css δεν κάνουν @import τις γραμματοσειρές, οπότε φορτώνονται εδώ. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Page-specific styles: ό,τι δεν καλύπτεται από τα shared components. -->
    <style>
      .nf__section {
        text-align: center;
        padding-block: 5rem;
      }

      /* Μεγάλο "404" σε Orbitron με το gradient της μάρκας. */
      .nf__code {
        font-family: var(--font-display);
        font-size: clamp(5rem, 18vw, 10rem);
        font-weight: 900;
        line-height: 1;
        background: var(--gradient-greek);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        margin-bottom: 0.5rem;
      }

      .nf__title {
        font-size: clamp(1.5rem, 4vw, 2.2rem);
        margin-bottom: 0.75rem;
      }

      .nf__text {
        color: hsl(var(--muted-foreground));
        max-width: 32rem;
        margin: 0 auto 2rem;
      }

      /* Κοντέρ που "χτυπάει" — η βελόνα σαρώνει πέρα-δώθε με CSS keyframes. */
      .nf__gauge {
        width: 180px;
        height: auto;
        margin: 0 auto 2rem;
        display: block;
      }

      .nf__needle {
        /* Περιστροφή γύρω από τον άξονα της βελόνας (κέντρο του καντράν). */
        transform-origin: 60px 60px;
        animation: nf-sweep 2.2s ease-in-out infinite;
      }

      @keyframes nf-sweep {
        0%,
        100% {
          transform: rotate(-80deg);
        }
        50% {
          transform: rotate(80deg);
        }
      }

      .nf__ctas {
        display: flex;
        gap: 1rem;
        justify-content: center;
        flex-wrap: wrap;
      }
    </style>
  </head>
  <body data-page="404">
    <div id="site-header"></div>

    <main>
      <section class="gsr__section nf__section">
        <div class="gsr__container">
          <div class="nf__code">404</div>
          <h1 class="nf__title">Λάθος Στροφή!</h1>
          <p class="nf__text">Η σελίδα που ψάχνεις δεν υπάρχει ή έχει μετακινηθεί.</p>

          <!-- Κοντέρ SVG: το καντράν είναι στατικό, η βελόνα κινείται με CSS. -->
          <svg class="nf__gauge" viewBox="0 0 120 78" role="img" aria-label="Κοντέρ που χτυπάει">
            <!-- Τόξο καντράν -->
            <path
              d="M 12 60 A 48 48 0 0 1 108 60"
              fill="none"
              stroke="hsl(var(--border))"
              stroke-width="6"
              stroke-linecap="round"
            />
            <!-- Κόκκινη ζώνη (redline) στο τέλος του τόξου -->
            <path
              d="M 94 26.6 A 48 48 0 0 1 108 60"
              fill="none"
              stroke="hsl(var(--destructive))"
              stroke-width="6"
              stroke-linecap="round"
            />
            <!-- Υποδιαιρέσεις -->
            <g stroke="hsl(var(--muted-foreground))" stroke-width="2">
              <line x1="16" y1="60" x2="24" y2="60" />
              <line x1="29" y1="29" x2="34.5" y2="34.5" />
              <line x1="60" y1="16" x2="60" y2="24" />
              <line x1="91" y1="29" x2="85.5" y2="34.5" />
              <line x1="104" y1="60" x2="96" y2="60" />
            </g>
            <!-- Βελόνα (κινούμενη) -->
            <g class="nf__needle">
              <line x1="60" y1="60" x2="60" y2="22" stroke="hsl(var(--accent))" stroke-width="3" stroke-linecap="round" />
            </g>
            <!-- Άξονας βελόνας -->
            <circle cx="60" cy="60" r="5" fill="hsl(var(--accent))" />
          </svg>

          <div class="nf__ctas">
            <a href="home.html" class="gsr__btn gsr__btn--primary">Αρχική Σελίδα</a>
            <button type="button" class="gsr__btn gsr__btn--outline" id="nf-back">Πίσω</button>
          </div>
        </div>
      </section>
    </main>

    <div id="site-footer"></div>

    <script type="module">
      import { mountShell } from "./js/partials.js";
      mountShell(document.body.dataset.page);

      // "Πίσω" = επιστροφή στην προηγούμενη σελίδα του ιστορικού.
      document.getElementById("nf-back").addEventListener("click", () => history.back());
    </script>
  </body>
</html>

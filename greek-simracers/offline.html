<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Χωρίς σύνδεση — Greek SimRacers</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/images/gsr-logo.png">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/hub.css">
</head>
<body>
<a class="skip-link" href="#main">Μετάβαση στο περιεχόμενο</a>

<main id="main" tabindex="-1">
  <section class="hub-section hub-section--lg">
    <div class="hub-container">
      <div class="hub-state" style="max-width:34rem; margin-inline:auto">
        <img src="assets/images/gsr-logo.png" alt="Greek SimRacers" style="width:5rem; height:auto; opacity:0.85">
        <h1 class="hub-state__title">Είσαι εκτός σύνδεσης</h1>
        <p class="hub-state__text">
          Δεν έχουμε σύνδεση στο δίκτυο αυτή τη στιγμή. Οι σελίδες που έχεις ήδη
          επισκεφθεί είναι διαθέσιμες — για τα υπόλοιπα χρειάζεται internet.
        </p>
        <div style="display:flex; gap:0.75rem; flex-wrap:wrap; justify-content:center">
          <button type="button" class="btn btn-primary" onclick="window.location.reload()">Δοκίμασε ξανά</button>
          <a class="btn btn-outline" href="index.html">Αρχική</a>
        </div>
      </div>
    </div>
  </section>
</main>

<script>
  // Μόλις γυρίσει το δίκτυο, φορτώνουμε ξανά μόνοι μας.
  window.addEventListener("online", () => window.location.reload());
</script>

</body>
</html>

<!doctype html>
<html lang="el" class="theme-dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Νέος κωδικός · Greek SimRacers</title>
    <meta name="description" content="Όρισε νέο κωδικό πρόσβασης για τον λογαριασμό σου." />
    <meta name="theme-color" content="#12141a" />
    <meta property="og:title" content="Νέος κωδικός · Greek SimRacers" />
    <meta property="og:description" content="Όρισε νέο κωδικό πρόσβασης για τον λογαριασμό σου." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="assets/logo.png" />
    <link rel="icon" href="assets/logo.png" />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/shell.css" />
    <link rel="stylesheet" href="css/pages.css" />
    <script>
      // Εφαρμογή θέματος πριν το πρώτο paint — αποφεύγει το «άσπρο φλας».
      (function () {
        var saved = localStorage.getItem("hub-theme");
        var light = saved ? saved === "light" : matchMedia("(prefers-color-scheme: light)").matches;
        document.documentElement.classList.add(light ? "theme-light" : "theme-dark");
        document.documentElement.style.colorScheme = light ? "light" : "dark";
      })();
    </script>
  </head>
  <body>
    <div class="hub-page">
      <main class="hub-page__main">
        <div class="u-shell u-shell--narrow" style="padding-block: 60px">
          <div class="hub-card hub-card--rail" style="max-width: 460px; margin: 0 auto">
            <span class="hub-eyebrow">Ασφάλεια</span>
            <h1 style="font-size: 1.7rem; margin-top: 10px">Νέος κωδικός</h1>
            <p class="u-dim u-small" style="margin: 8px 0 20px">
              Γράψε τον νέο κωδικό σου. Χρειάζονται τουλάχιστον 6 χαρακτήρες.
            </p>
            <form id="reset-form" class="u-stack" style="--gap: 14px">
              <label class="hub-field"><span>Νέος κωδικός</span>
                <input class="hub-input" type="password" name="password" minlength="6" required autocomplete="new-password" />
              </label>
              <label class="hub-field"><span>Επιβεβαίωση</span>
                <input class="hub-input" type="password" name="confirm" minlength="6" required autocomplete="new-password" />
              </label>
              <button class="hub-btn hub-btn--primary hub-btn--block" type="submit">Αποθήκευση</button>
            </form>
            <p class="u-small u-center" style="margin-top: 16px"><a href="auth.html">Πίσω στη σύνδεση</a></p>
          </div>
        </div>

      </main>
      <div data-shell-footer></div>
    </div>

    <!-- Το UMD bundle του Supabase φορτώνεται πριν τα modules (χωρίς npm/build). -->
    <script src="js/vendor/supabase.umd.js"></script>
    <script type="module" src="js/pages/reset-password.js"></script>
  </body>
</html>

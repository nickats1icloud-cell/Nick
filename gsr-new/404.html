<!doctype html>
<html lang="el" class="theme-dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Λάθος στροφή · Greek SimRacers</title>
    <meta name="description" content="Η σελίδα που ζήτησες δεν βρέθηκε." />
    <meta name="theme-color" content="#12141a" />
    <meta property="og:title" content="Λάθος στροφή · Greek SimRacers" />
    <meta property="og:description" content="Η σελίδα που ζήτησες δεν βρέθηκε." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="assets/logo.png" />
    <link rel="icon" href="assets/logo.png" />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/shell.css" />
    <link rel="stylesheet" href="css/pages.css" />
    <script>
      // Εφαρμογή θέματος πριν το πρώτο paint — αποφεύγει το «άσπρο φλας».
      (function () {
        var saved = localStorage.getItem("hub-theme");
        var light = saved ? saved === "light" : matchMedia("(prefers-color-scheme: light)").matches;
        document.documentElement.classList.add(light ? "theme-light" : "theme-dark");
        document.documentElement.style.colorScheme = light ? "light" : "dark";
      })();
    </script>
  </head>
  <body>
    <div class="hub-page">
      <main class="hub-page__main">
        <div class="nf">
          <div>
            <p class="hub-eyebrow" style="justify-content: center">Off track</p>
            <p class="nf__code">404</p>
            <div class="nf__flag" aria-hidden="true"></div>
            <h1 style="font-size: 1.6rem">Λάθος στροφή!</h1>
            <p class="u-dim" style="max-width: 44ch; margin: 12px auto 26px">
              Βγήκες εκτός πίστας. Η σελίδα που ζήτησες δεν υπάρχει ή μετακινήθηκε.
            </p>
            <div class="u-row" style="justify-content: center; flex-wrap: wrap">
              <a class="hub-btn hub-btn--primary" href="home.html">Πίσω στην πίστα</a>
              <a class="hub-btn" href="forum.html">Forum</a>
              <a class="hub-btn" href="contact.html">Επικοινωνία</a>
            </div>
          </div>
        </div>

      </main>
      <div data-shell-footer></div>
    </div>

    <!-- Το UMD bundle του Supabase φορτώνεται πριν τα modules (χωρίς npm/build). -->
    <script src="js/vendor/supabase.umd.js"></script>
    <script type="module" src="js/pages/static.js"></script>
  </body>
</html>
